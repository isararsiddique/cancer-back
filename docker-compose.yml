
services:
  db:
    image: postgres:16-alpine
    container_name: cancer-registry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Isarar@786Isarar
      POSTGRES_DB: cancer_registry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cancer_registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cancer-registry-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:Isarar%40786Isarar@db:5432/cancer_registry
      JWT_SECRET: cancer-registry-production-jwt-secret-key-2024-change-this-to-secure-random-string
      JWT_ISS: registry.api
      JWT_AUD: registry.clients
      ALLOWED_ORIGINS: "*"
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      WORKERS: 2
      REDIS_URL: ""
      CACHE_ENABLED: "true"
      WHO_CLIENT_ID: ebea7984-077e-4366-a655-65531bdb26c5_c389da01-7ffe-42ed-b382-23370ef4ab1f
      WHO_CLIENT_SECRET: 3SyTLj3I9SH6WQa3XOtnv6NmSAS1oRKryRt7xoIVUTQ=
      WHO_API_BASE: https://id.who.int
      WHO_TOKEN_URL: https://icdaccessmanagement.who.int/connect/token
      WHO_API_URL: https://id.who.int/icd/release/11/2025-01
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: cancer-registry-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - /opt/cancer-frontend:/usr/share/nginx/html:ro
      - /opt/cancer-registry/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
